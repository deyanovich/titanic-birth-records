<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#ffffff"/>
  <!-- certificate double frame -->
  <rect x="36" y="36" width="1128" height="1128" fill="none" stroke="#8a2434" stroke-width="3"/>
  <rect x="48" y="48" width="1104" height="1104" fill="none" stroke="#d8c3c7" stroke-width="1.5"/>
  <g stroke="#8a2434" stroke-width="3">
    <path d="M 36 90 v -54 h 54" fill="none"/>
    <path d="M 1110 36 h 54 v 54" fill="none"/>
    <path d="M 1164 1110 v 54 h -54" fill="none"/>
    <path d="M 90 1164 h -54 v -54" fill="none"/>
  </g>
  <!-- everything below sits in the center band (y 280-920), so a
       landscape center-crop keeps the whole composition -->
  <text x="600" y="360" text-anchor="middle" font-family="IBM Plex Serif" font-weight="600" font-size="68" fill="#5e1a24">Titanic Birth Records</text>
  <text x="600" y="412" text-anchor="middle" font-family="IBM Plex Sans" font-size="28" fill="#555555">fictional 1912 birth records &#183; eight archive shapes</text>
  <line x1="300" y1="446" x2="900" y2="446" stroke="#d8c3c7" stroke-width="1.5"/>
  <g font-family="IBM Plex Mono" font-size="27" fill="#333333">
    <text x="330" y="506">titanic-birth-records.json</text>
    <text x="330" y="550">&#9500;&#9472; gro</text>
    <text x="700" y="550">&#9500;&#9472; us_state_records</text>
    <text x="330" y="592">&#9500;&#9472; irish_parishes</text>
    <text x="700" y="592">&#9500;&#9472; ottoman_nufus</text>
    <text x="330" y="634">&#9500;&#9472; kyrkob&#246;cker</text>
    <text x="700" y="634">&#9500;&#9472; matricula_bapt.</text>
    <text x="330" y="676">&#9492;&#9472; actes_de_naiss.</text>
    <text x="700" y="676">&#9492;&#9472; metricheskie_kn.</text>
  </g>
  <g font-family="IBM Plex Mono" font-size="27">
    <text x="330" y="768" fill="#8a2434">//*[::passenger_id] @| count</text>
    <text x="330" y="810" fill="#555555">1146</text>
  </g>
  <text x="900" y="880" text-anchor="end" font-family="IBM Plex Mono" font-size="23" fill="#999999">quarb.org</text>
  <!-- expendable ornament outside the center band -->
  <g fill="#8a2434">
    <rect x="588" y="158" width="10" height="10" transform="rotate(45 593 163)"/>
    <rect x="562" y="158" width="7" height="7" transform="rotate(45 565.5 161.5)"/>
    <rect x="617" y="158" width="7" height="7" transform="rotate(45 620.5 161.5)"/>
  </g>
  <text x="600" y="1050" text-anchor="middle" font-family="IBM Plex Mono" font-size="22" fill="#999999">deyanovich/titanic-birth-records &#183; CC0</text>
</svg>
